# Гудини целиком на этом компьютере: сайт + воркер монтажа + HTTPS через DuckDNS.
#
#   docker compose up -d --build                    # сайт и воркер; сайт на http://localhost:3000
#   docker compose --profile public up -d --build   # плюс Caddy (HTTPS) и обновление DuckDNS
#
# Настройки — в .env: GUDINI_PASSWORD (пароль входа), ключи ИИ, для публичного доступа —
# DOMAIN (xxx.duckdns.org), DUCKDNS_SUBDOMAIN (xxx), DUCKDNS_TOKEN, SITE_URL (https://xxx.duckdns.org).
# Данные сайта (проекты, загрузки, готовые ролики) живут в томе gudini-site-data,
# данные воркера — в gudini-worker-data. Лимита на объём нет: это ваш диск.
services:
  gudini-site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gudini-site
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      # Codex runs on Windows with the owner's ChatGPT login; credentials stay on the host.
      CODEX_BRIDGE_URL: http://host.docker.internal:43127
      # пусто — сайт открыт без пароля; GUDINI_PASSWORD воркера при этом просто не проверяется
      SITE_PASSWORD: ${SITE_PASSWORD:-}
      # монтаж только на воркере: сайт не запускает конвейер у себя, если воркер молчит
      WORKER_ONLY: "1"
      # адрес, по которому сайт виден снаружи: нужен OAuth-коллбэкам и Instagram Reels
      PUBLIC_BASE_URL: ${SITE_URL:-http://localhost:3000}
      # вкладка /clipy: сайт проксирует её в контейнер clipy (снаружи это делает Caddy напрямую)
      CLIPY_URL: http://clipy:8500
      # раздел /threads: то же для контейнера threads-app
      THREADS_URL: http://threads-app:8600
      TIKTOK_TRANSPORT: browser
      TIKTOK_BROWSER_URL: http://tiktok-browser:43128
    ports:
      # только с этого компьютера; из интернета — через caddy
      # 3000 открыт и в домашней сети: роутер не заворачивает свой внешний адрес обратно внутрь,
      # поэтому дома сайт открывается как http://192.168.1.68:3000 (снаружи — только через Caddy по https)
      - "3000:3000"
    volumes:
      - gudini-site-data:/app/data

  tiktok-browser:
    build:
      context: .
      dockerfile: Dockerfile.tiktok
    container_name: gudini-tiktok-browser
    restart: unless-stopped
    command: ["npm", "run", "worker:tiktok"]
    env_file: .env
    environment:
      TIKTOK_TRANSPORT: browser
      TIKTOK_BROWSER_HOST: "0.0.0.0"
    volumes:
      - gudini-site-data:/app/data
    shm_size: "1gb"

  gudini-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: gudini-worker
    restart: unless-stopped
    env_file: .env
    environment:
      # воркер ходит на сайт по внутренней сети Docker, исходник не гоняется через интернет
      GUDINI_URL: http://gudini-site:3000
      CODEX_BRIDGE_URL: http://host.docker.internal:43127
      # AI-фильм: Veo на Vertex AI через учётные данные gcloud (application-default login);
      # ключей в .env нет, файл смонтирован только для чтения
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-adc.json
    depends_on:
      - gudini-site
    volumes:
      - gudini-worker-data:/app/data
      - ${GCLOUD_ADC_FILE:-./data/gcp-adc-missing.json}:/app/gcp-adc.json:ro

  # --- Clipy, вкладка /clipy: замена лица в чужом ролике на своё (FaceFusion на GPU) ---
  # Образ ~8 ГБ (CUDA + модели) и том clipy-data лежат там же, где остальной Docker (диск D).
  clipy:
    build:
      context: ./clipy
    container_name: gudini-clipy
    restart: unless-stopped
    environment:
      # тот же вход, что у сайта: пустой SITE_PASSWORD — открыт, иначе cookie gudini_auth или /login
      CLIPY_PASSWORD: ${SITE_PASSWORD:-}
      CLIPY_URL_PREFIX: /clipy
    ports:
      # как и 3000: дома открывается напрямую http://192.168.1.68:8500/clipy, снаружи — через Caddy
      - "8500:8500"
    volumes:
      - clipy-data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # --- Threads, раздел /threads: автономный русскоязычный крипто-аккаунт в Threads (threads/) ---
  # Обособленный сервис: свои Postgres и Redis, один образ для API+dashboard (app) и очередей (worker).
  # Секреты и ключи — в threads/.env (см. threads/.env.example); адреса БД подставляются здесь.
  threads-app:
    build:
      context: ./threads
    container_name: gudini-threads-app
    restart: unless-stopped
    env_file:
      - path: ./threads/.env
        required: false
    environment:
      PORT: "8600"
      DATABASE_URL: postgres://threads:threads@threads-postgres:5432/threads
      REDIS_URL: redis://threads-redis:6379
      SITE_PASSWORD: ${SITE_PASSWORD:-}
      PUBLIC_BASE_URL: ${SITE_URL:-http://localhost:3000}
      DATA_DIR: /app/data
    ports:
      # дома открывается напрямую http://192.168.1.68:8600/threads/, снаружи — через Caddy
      - "8600:8600"
    volumes:
      - threads-data:/app/data
    depends_on:
      threads-postgres:
        condition: service_healthy
      threads-redis:
        condition: service_started

  threads-worker:
    build:
      context: ./threads
    container_name: gudini-threads-worker
    restart: unless-stopped
    command: ["node", "dist/src/worker.js"]
    env_file:
      - path: ./threads/.env
        required: false
    environment:
      DATABASE_URL: postgres://threads:threads@threads-postgres:5432/threads
      REDIS_URL: redis://threads-redis:6379
      PUBLIC_BASE_URL: ${SITE_URL:-http://localhost:3000}
      DATA_DIR: /app/data
    volumes:
      - threads-data:/app/data
    depends_on:
      threads-postgres:
        condition: service_healthy
      threads-redis:
        condition: service_started

  threads-postgres:
    image: postgres:17-alpine
    container_name: gudini-threads-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: threads
      POSTGRES_PASSWORD: threads
      POSTGRES_DB: threads
    volumes:
      - threads-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threads -d threads"]
      interval: 5s
      timeout: 3s
      retries: 20

  threads-redis:
    image: redis:7-alpine
    container_name: gudini-threads-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - threads-redis-data:/data

  # --- публичный HTTPS: включается профилем `public`, когда домен и проброс порта готовы ---
  caddy:
    profiles: ["public"]
    build: ./deploy/caddy
    container_name: gudini-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gudini-site

  duckdns:
    profiles: ["public"]
    image: lscr.io/linuxserver/duckdns:latest
    container_name: gudini-duckdns
    restart: unless-stopped
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN:-}
      TOKEN: ${DUCKDNS_TOKEN:-}
      UPDATE_IP: ipv4
      LOG_FILE: "false"

volumes:
  gudini-site-data:
  gudini-worker-data:
  clipy-data:
  threads-data:
  threads-pg-data:
  threads-redis-data:
  caddy-data:
  caddy-config:
