# Гудини целиком на этом компьютере: сайт + воркер монтажа + HTTPS через DuckDNS.
#
#   docker compose up -d --build                    # сайт и воркер; сайт на http://localhost:3000
#   docker compose --profile public up -d --build   # плюс Caddy (HTTPS) и обновление DuckDNS
#
# Настройки — в .env: GUDINI_PASSWORD (пароль входа), ключи ИИ, для публичного доступа —
# DOMAIN (xxx.duckdns.org), DUCKDNS_SUBDOMAIN (xxx), DUCKDNS_TOKEN, SITE_URL (https://xxx.duckdns.org).
# Данные сайта (проекты, загрузки, готовые ролики) живут в томе gudini-site-data,
# данные воркера — в gudini-worker-data. Лимита на объём нет: это ваш диск.
services:
  gudini-site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gudini-site
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      # пусто — сайт открыт без пароля; GUDINI_PASSWORD воркера при этом просто не проверяется
      SITE_PASSWORD: ${SITE_PASSWORD:-}
      # монтаж только на воркере: сайт не запускает конвейер у себя, если воркер молчит
      WORKER_ONLY: "1"
      # адрес, по которому сайт виден снаружи: нужен OAuth-коллбэкам и Instagram Reels
      PUBLIC_BASE_URL: ${SITE_URL:-http://localhost:3000}
    ports:
      # только с этого компьютера; из интернета — через caddy
      - "127.0.0.1:3000:3000"
    volumes:
      - gudini-site-data:/app/data

  gudini-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: gudini-worker
    restart: unless-stopped
    env_file: .env
    environment:
      # воркер ходит на сайт по внутренней сети Docker, исходник не гоняется через интернет
      GUDINI_URL: http://gudini-site:3000
    depends_on:
      - gudini-site
    volumes:
      - gudini-worker-data:/app/data

  # --- публичный HTTPS: включается профилем `public`, когда домен и проброс порта готовы ---
  caddy:
    profiles: ["public"]
    build: ./deploy/caddy
    container_name: gudini-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gudini-site

  duckdns:
    profiles: ["public"]
    image: lscr.io/linuxserver/duckdns:latest
    container_name: gudini-duckdns
    restart: unless-stopped
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN:-}
      TOKEN: ${DUCKDNS_TOKEN:-}
      UPDATE_IP: ipv4
      LOG_FILE: "false"

volumes:
  gudini-site-data:
  gudini-worker-data:
  caddy-data:
  caddy-config:
